name: Automatically deploy website

on:
  pull_request:
    branches: [hexo-source]
  workflow_dispatch:
  push:
    branches: 
      - hexo-source

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  blog-cicd:
    name: Hexo blog build & deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout codes
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Install hexo dependencies
      run: |
        npm ci
        git restore node_modules/markdown-it-emoji/index.js

    - name: Generate files
      run: |
        npm run clean
        npm run build
        node tools/check-legacy-site.cjs

    - name: Deploy hexo blog
      if: github.event_name == 'push' && github.ref == 'refs/heads/hexo-source'
      env: 
        GITHUB_REPO: github.com/sunick2009/sunick2009.github.io
      run: |
        cd ./public && git init && git add .
        git config user.name "sunick2009"
        git config user.email "sunick2009@gmail.com"
        git add .
        git commit -m "GitHub Actions Auto Builder at $(date +'%Y-%m-%d %H:%M:%S')"
        git push --force --quiet "https://${{ secrets.ACCESS_TOKEN }}@$GITHUB_REPO" master:master
