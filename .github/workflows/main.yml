name: Build and deploy blog

on:
  push:
    branches: [hexo-source]
  pull_request:
    branches: [hexo-source]
  workflow_dispatch:

env:
  TZ: Asia/Taipei

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run clean
      - name: Build and reject logged Hexo errors
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -Eq '(^|[[:space:]])(ERROR|FATAL)([[:space:]]|$)' build.log; then
            exit 1
          fi
      - run: npm run check
      - name: Checkout published branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/hexo-source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: .deploy-site
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Publish verified output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/hexo-source'
        run: |
          rsync -a --delete --exclude=.git public/ .deploy-site/
          touch .deploy-site/.nojekyll
          cd .deploy-site
          git config user.name "sunick2009"
          git config user.email "sunick2009@gmail.com"
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build blog from $GITHUB_SHA"
          git push origin HEAD:master
