# Site overrides for Butterfly 5.7.0. Upstream defaults come from the npm package.
# Legacy Universal Analytics UA-158679472-1 is retired; add a GA4 ID when available.
menu:
  首頁: / || fas fa-home
  時間軸: /archives/ || fas fa-archive
  標籤: /tags/ || fas fa-tags
  分類: /categories/ || fas fa-folder-open
  留言板: /message%20board/ || fas fa-comments
social:
  fab fa-github: https://github.com/sunick2009 || GitHub
  fas fa-envelope: mailto:sunick2009@gmail.com || Email
  fas fa-rss: /atom.xml || RSS
favicon: /img/favicon.ico
index_img: https://imgur.com/qG9piTA.jpg
default_top_img: https://imgur.com/qG9piTA.jpg
archive_img: https://imgur.com/qG9piTA.jpg
tag_img: https://cdn.jsdelivr.net/gh/jerryc127/butterfly_cdn@2.1.0/top_img/tag.png
category_img: https://cdn.jsdelivr.net/gh/jerryc127/butterfly_cdn@2.1.0/top_img/category.jpg
post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
related_post:
  enable: true
  limit: 6
  date_type: created
theme_color:
  enable: true
  main: '#708adc'
  paginator: '#5a3faa'
  button_hover: '#420457'
  text_selection: '#708adc'
  link_color: '#99a9bf'
  meta_color: '#858585'
  hr_color: '#A4D8FA'
  read-mode-bg_color: '#FAF9DE'
  inline-code-color: '#F47466'
canvas_nest:
  enable: true
  color: 90,63,170
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true
subtitle:
  enable: true
  source: false
  sub:
  - Keep learning
  - Think different
wordcount:
  enable: true
note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0
display_mode: light
avatar:
  img: https://imgur.com/BwKsEfG.jpg
  effect: false
cover:
  default_cover:
  - https://cdn.jsdelivr.net/gh/jerryc127/butterfly_cdn@2.1.0/top_img/default.png
error_img:
  flink: /img/friend_404.gif
  post_page: https://imgur.com/ED0wFaA.jpg
index_layout: 3
index_post_content:
  method: 3
  length: 150
code_blocks:
  theme: light
  copy: true
  language: true
  shrink: false
  word_wrap: false
search:
  use: local_search
  placeholder: 搜尋
toc:
  post: true
  page: false
  number: true
footer:
  owner:
    enable: true
    since: 2020
aside:
  position: left
  mobile: true
  card_author:
    button:
      link: https://github.com/sunick2009
  card_announcement:
    content: 開張啦，歡迎光臨(*ﾟ∀ﾟ*)
  card_webinfo:
    runtime_date: 02/17/2020 15:00:00
translate:
  enable: true
  default: 簡
  defaultEncoding: 1
  translateDelay: 0
  msgToTraditionalChinese: 繁
  msgToSimplifiedChinese: 简
readmode: true
darkmode:
  enable: true
  autoChangeMode: false
lightbox: fancybox
instantpage: true
lazyload:
  enable: true
  native: true
  field: site
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq
comments:
  use: Valine
  count: false
valine:
  appId: 9AhbD7NaCezDIb0Y8pBilq0q-MdYXbMMI
  appKey: a6JCosocPJwjM7wmeyg25PHM
  avatar: monsterid
  bg: /img/comment_bg.png
  option:
    pageSize: 10
    lang: zh-TW
    placeholder: Please leave your footprints
    meta:
    - nick
    - mail
    - link
site_verification:
- name: google-site-verification
  content: BVjq85QtM1ejI-lD_4FfPiOJGFi_y_396uGllb_WK78
blog_title_font:
  font_link: https://fonts.googleapis.com/css?family=Titillium+Web
  font_family: Titillium Web, PingFang SC, Hiragino Sans GB, "Microsoft YaHei", Helvetica
    Neue, Helvetica, Arial, sans-serif
hr_icon:
  enable: false
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
inject:
  head:
  - <link rel="stylesheet" href="/css/custom.css">
